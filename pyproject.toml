[project]
name = "system-one-5g"
version = "0.1.0"
description = "Standalone synthetic server-management decision experiment"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2",
    "torch>=2.5",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "prometheus-client>=0.21",
    "docker>=7",
]

[project.scripts]
system-one = "system_one.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
